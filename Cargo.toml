[package]
name = "mcstat"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Live terminal monitor for Minecraft Java Edition servers (Server List Ping, SRV, parallel polling)"
readme = "README.md"
repository = "https://github.com/Shidori5417/mcstat"
license = "MIT"
keywords = ["minecraft", "tui", "ratatui", "server-status", "monitoring"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
hickory-resolver = "0.26.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.3"
